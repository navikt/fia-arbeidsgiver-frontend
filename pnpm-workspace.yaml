overrides:
  handlebars: "4.7.9"
  postcss: "8.5.23"
  sharp@<0.35.0: ^0.35.0
  brace-expansion@<2.1.3: ^2.1.3
  proxy-addr: 2.0.8 # versjon 2.0.7 har en kritisk sårbarhet (transitive dependency på "express 5.2.1")

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Sett minimumReleaseAge for å unngå at pakker som nylig er publisert (< 7 dager) blir brukt i byggene.
# Sikkerhetstiltak for å unngå at vi bruker pakker som nylig er publisert og som potensielt kan være ondsinnede eller ustabile.
minimumReleaseAge: 10080 # 7 dager

minimumReleaseAgeExclude:
  - "@navikt/*"
  - "baseline-browser-mapping"
  - "caniuse-lite"
